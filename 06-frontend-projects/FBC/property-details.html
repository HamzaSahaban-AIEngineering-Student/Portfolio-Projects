
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Bridge Company - إضافة عقار جديد</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"> 

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="form.css">
    <!-- <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet"> -->
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="user-info">
                    <div class="user-avatar">
                        <img src="https://via.placeholder.com/50x50/4A90E2/ffffff?text=أ.م" alt="أحمد محمد">
                    </div>
                    <div class="user-details">
                        <span class="user-name">أحمد محمد</span>
                        <span class="user-role">مدير المبيعات</span>
                    </div>
                </div>
                
                <nav class="nav-menu">
                    <a href="index.html" class="nav-link">الرئيسية</a>
                    <a href="dashboard.html" class="nav-link">لوحة التحكم</a>
                    <a href="property-form.html" class="nav-link active">إضافة عقار جديد</a>
                </nav>
                
                <div class="logo">
                    <h1><a href="index.html">FBC</a></h1>
                    <span>Future Bridge Company</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Form Navigation Tabs -->
            <div class="form-tabs">
                <button class="tab-button active" data-tab="basic">بيانات أساسية</button>
                <button class="tab-button" data-tab="location">الموقع والمساحة</button>
                <button class="tab-button" data-tab="features">المميزات والخدمات</button>
                <button class="tab-button" data-tab="pricing">التسعير والشروط</button>
            </div>

            <!-- Form Content -->
            <div class="form-container">
                <!-- Basic Information Tab -->
                <div class="tab-content active" id="basic">
                    <div class="form-section">
                        <div class="section-header">
                            <h2>بيانات أساسية</h2>
                            <div class="section-icon">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M3 9L12 2L21 9V20C21 20.5523 20.5523 21 20 21H4C3.44772 21 3 20.5523 3 20V9Z" stroke="currentColor" stroke-width="2"/>
                                    <path d="M9 22V12H15V22" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="form-grid">
                            <div class="form-group">
                                <label>نوع العقار</label>
                                <select class="form-control">
                                    <option>اختر نوع العقار...</option>
                                    <option>شقة سكنية</option>
                                    <option>فيلا</option>
                                    <option>مكتب تجاري</option>
                                    <option>محل تجاري</option>
                                    <option>أرض</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>رقم العقار</label>
                                <input type="text" class="form-control" placeholder="أدخل رقم العقار...">
                            </div>
                            
                            <div class="form-group">
                                <label>عنوان العقار</label>
                                <input type="text" class="form-control" placeholder="أدخل العنوان كاملاً...">
                            </div>
                            
                            <div class="form-group">
                                <label>المدينة</label>
                                <select class="form-control">
                                    <option>اختر المدينة...</option>
                                    <option>الرياض</option>
                                    <option>جدة</option>
                                    <option>الدمام</option>
                                    <option>مكة المكرمة</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>الحي</label>
                                <input type="text" class="form-control" placeholder="أدخل اسم الحي...">
                            </div>
                            
                            <div class="form-group">
                                <label>المساحة (متر مربع)</label>
                                <input type="number" class="form-control" placeholder="أدخل المساحة...">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Location Tab -->
                <div class="tab-content" id="location">
                    <div class="form-section">
                        <div class="section-header">
                            <h2>الموقع والمساحة</h2>
                            <div class="section-icon">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M21 10C21 17 12 23 12 23S3 17 3 10C3 5.02944 7.02944 1 12 1C16.9706 1 21 5.02944 21 10Z" stroke="currentColor" stroke-width="2"/>
                                    <circle cx="12" cy="10" r="3" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="form-grid">
                            <div class="form-group">
                                <label>عدد الغرف</label>
                                <select class="form-control">
                                    <option>اختر عدد الغرف...</option>
                                    <option>1</option>
                                    <option>2</option>
                                    <option>3</option>
                                    <option>4</option>
                                    <option>5+</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>عدد دورات المياه</label>
                                <select class="form-control">
                                    <option>اختر عدد دورات المياه...</option>
                                    <option>1</option>
                                    <option>2</option>
                                    <option>3</option>
                                    <option>4+</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>عدد الطوابق</label>
                                <select class="form-control">
                                    <option>اختر عدد الطوابق...</option>
                                    <option>طابق واحد</option>
                                    <option>طابقين</option>
                                    <option>ثلاثة طوابق</option>
                                    <option>أكثر من ثلاثة</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>مساحة الأرض</label>
                                <input type="number" class="form-control" placeholder="أدخل مساحة الأرض...">
                            </div>
                            
                            <div class="form-group">
                                <label>مساحة البناء</label>
                                <input type="number" class="form-control" placeholder="أدخل مساحة البناء...">
                            </div>
                            
                            <div class="form-group">
                                <label>عمر العقار (بالسنوات)</label>
                                <input type="number" class="form-control" placeholder="أدخل عمر العقار...">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Features Tab -->
                <div class="tab-content" id="features">
                    <div class="form-section">
                        <div class="section-header">
                            <h2>المميزات والخدمات</h2>
                            <div class="section-icon">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9 12L11 14L15 10" stroke="currentColor" stroke-width="2"/>
                                    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="checkbox-grid">
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" class="checkbox-input">
                                    <span class="checkbox-text">هل يوجد مصعد؟</span>
                                    <div class="radio-options">
                                        <label><input type="radio" name="elevator" value="yes"> نعم</label>
                                        <label><input type="radio" name="elevator" value="no"> لا</label>
                                    </div>
                                </label>
                            </div>
                            
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" class="checkbox-input">
                                    <span class="checkbox-text">هل يوجد موقف سيارات؟</span>
                                    <div class="radio-options">
                                        <label><input type="radio" name="parking" value="yes"> نعم</label>
                                        <label><input type="radio" name="parking" value="no"> لا</label>
                                    </div>
                                </label>
                            </div>
                            
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" class="checkbox-input">
                                    <span class="checkbox-text">هل يوجد حديقة أو بلكونة؟</span>
                                    <div class="radio-options">
                                        <label><input type="radio" name="garden" value="yes"> نعم</label>
                                        <label><input type="radio" name="garden" value="no"> لا</label>
                                    </div>
                                </label>
                            </div>
                            
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" class="checkbox-input">
                                    <span class="checkbox-text">هل يوجد مسبح؟</span>
                                    <div class="radio-options">
                                        <label><input type="radio" name="pool" value="yes"> نعم</label>
                                        <label><input type="radio" name="pool" value="no"> لا</label>
                                    </div>
                                </label>
                            </div>
                            
                            <div class="checkbox-group">
                                <label class="checkbox-label">
                                    <input type="checkbox" class="checkbox-input">
                                    <span class="checkbox-text">هل يوجد أمن وحراسة؟</span>
                                    <div class="radio-options">
                                        <label><input type="radio" name="security" value="yes"> نعم</label>
                                        <label><input type="radio" name="security" value="no"> لا</label>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pricing Tab -->
                <div class="tab-content" id="pricing">
                    <div class="form-section">
                        <div class="section-header">
                            <h2>التسعير والشروط</h2>
                            <div class="section-icon">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                                    <path d="M12 6V12L16 14" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </div>
                        </div>
                        
                        <div class="form-grid">
                            <div class="form-group">
                                <label>السعر المطلوب</label>
                                <input type="number" class="form-control" placeholder="أدخل السعر بالريال السعودي...">
                            </div>
                            
                            <div class="form-group">
                                <label>نوع العرض</label>
                                <select class="form-control">
                                    <option>اختر نوع العرض...</option>
                                    <option>للبيع</option>
                                    <option>للإيجار</option>
                                    <option>للبيع والإيجار</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>طريقة الدفع المفضلة</label>
                                <select class="form-control">
                                    <option>اختر طريقة الدفع...</option>
                                    <option>نقداً</option>
                                    <option>تقسيط</option>
                                    <option>نقداً وتقسيط</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>مدة الإيجار (إن وجد)</label>
                                <select class="form-control">
                                    <option>اختر مدة الإيجار...</option>
                                    <option>شهرياً</option>
                                    <option>سنوياً</option>
                                    <option>عدة سنوات</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label>ملاحظات إضافية</label>
                                <textarea class="form-control" rows="4" placeholder="أدخل أي ملاحظات إضافية..."></textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="form-actions">
                    <button type="submit" class="submit-btn">حفظ بيانات العقار</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">

                <div class="footer-center">
                    <p>المحفوظة وحقوق الاستخدام</p>
                </div>
                
                <div class="footer-right">
                    <div class="footer-logo">
                        <h2>FBC</h2>
                    </div>
                    <p>© رمز 2023. جميع الحقوق محفوظة</p>
                </div>
            </div>
        </div>

</body>
</html>
